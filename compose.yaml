services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moment_one_dev}
      POSTGRES_USER: ${POSTGRES_USER:-moment_one}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moment-one-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      # Containers cannot use the host-side 127.0.0.1 database URL from .env.
      MOMENT_ONE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moment_one}:${POSTGRES_PASSWORD:-moment-one-local-only}@postgres:5432/${POSTGRES_DB:-moment_one_dev}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
