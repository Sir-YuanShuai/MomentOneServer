name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-database:
    name: Quality and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moment_one_test
          POSTGRES_USER: moment_one
          POSTGRES_PASSWORD: moment-one-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moment_one -d moment_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOMENT_ONE_ENV: test
      MOMENT_ONE_DEBUG: "false"
      MOMENT_ONE_DATABASE_URL: postgresql+psycopg://moment_one:moment-one-ci-only@127.0.0.1:5432/moment_one_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run quality gates and unit/API tests
        run: make check PYTHON=python

      - name: Validate migrations against PostgreSQL
        run: python -m alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: make test-integration PYTHON=python

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: >-
          docker build
          --build-arg BUILD_COMMIT=${GITHUB_SHA}
          --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          --tag moment-one-server:${GITHUB_SHA} .

      - name: Start image
        run: >-
          docker run --detach --rm
          --name moment-one-server
          --publish 8000:8000
          --env MOMENT_ONE_ENV=test
          --env MOMENT_ONE_DATABASE_URL=postgresql+psycopg://dummy:dummy@127.0.0.1:5432/dummy
          moment-one-server:${GITHUB_SHA}

      - name: Smoke-test health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs moment-one-server
          exit 1

      - name: Smoke-test record-type registry (contracts inside image)
        run: >-
          docker exec moment-one-server python -c
          "from app.modules.moment_types.registry import get_schema;
          assert get_schema('bookkeeping')['title'];
          assert get_schema('habit')['title'];
          print('registry schemas OK')"

      - name: Smoke-test MCP Apps UI resources in image
        run: >-
          docker exec -e MOMENT_ONE_MCP_APPS_HTML_PATH=/app/mcp_apps/bookkeeping/dist/bookkeeping.html
          moment-one-server python -c
          "from app.core.config import Settings;
          from app.modules.mcp.endpoint import _load_apps_html;
          html = _load_apps_html(Settings());
          assert all(html.values());
          assert 'Moment One' in html['bookkeeping'];
          assert 'Moment One' in html['timeline'];
          assert 'Moment One' in html['habits'];
          print('MCP Apps UI OK:', {k: len(v or '') for k, v in html.items()})"

      - name: Print container logs on failure
        if: failure()
        run: docker logs moment-one-server || true

  publish:
    name: Publish image to GHCR
    needs: [quality-and-database, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build time
        id: build-info
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build-info.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_ID: ${{ secrets.MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_ID }}
          MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_SECRET: ${{ secrets.MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_ID,MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_SECRET
          script: |
            set -euo pipefail
            cd "${{ secrets.SERVER_DEPLOY_PATH }}"
            : "${MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_ID:?Missing Casdoor management client ID}"
            : "${MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_SECRET:?Missing Casdoor management client secret}"
            sync_env_secret() {
              key="$1"
              value="$2"
              temporary="$(mktemp .env.XXXXXX)"
              grep -v "^${key}=" .env > "${temporary}"
              printf '%s=%s\n' "${key}" "${value}" >> "${temporary}"
              chmod 600 "${temporary}"
              mv "${temporary}" .env
            }
            sync_env_secret MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_ID "${MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_ID}"
            sync_env_secret MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_SECRET "${MOMENT_ONE_CASDOOR_MANAGEMENT_CLIENT_SECRET}"
            for attempt in 1 2 3 4 5; do
              if docker compose -f compose.prod.yml pull api; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Image pull failed after 5 attempts"
                exit 1
              fi
              echo "Image pull failed (attempt $attempt/5); retrying in 10s"
              sleep 10
            done
            docker compose -f compose.prod.yml run --rm api alembic upgrade head
            docker compose -f compose.prod.yml up -d api
            for attempt in $(seq 1 30); do
              if docker compose -f compose.prod.yml exec -T api python -c \
                'import json, urllib.request; data = json.load(urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)); assert data.get("status") == "ok", data'; then
                echo "Deployment healthy"
                exit 0
              fi
              sleep 1
            done
            docker compose -f compose.prod.yml logs --tail=100 api
            exit 1
